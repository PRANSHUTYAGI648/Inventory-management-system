<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>📦 Inventory</h2>

        <nav>
            <a href="/">🏠 Dashboard</a>
            <a href="/add_product" class="active">📦 Products</a>
            <a href="#">📊 Stock</a>
            <a href="#">📋 Categories</a>
            <a href="#">📈 Reports</a>
        </nav>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <header>
            <div>
                <h1>Add New Product</h1>
                <p>FORM TEST</p>
            </div>
        </header>


        <section class="products">

            <form action="{{ url_for('add_product') }}" method="POST">

                <div class="form-group">

                    <label for="product_name">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="product_name"
                        name="product_name"
                        placeholder="Enter product name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <input
                        type="text"
                        id="category"
                        name="category"
                        placeholder="Enter category"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="price">
                        Price (₹)
                    </label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        placeholder="Enter price"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="stock">
                        Stock
                    </label>

                    <input
                        type="number"
                        id="stock"
                        name="stock"
                        placeholder="Enter stock quantity"
                        min="0"
                        required
                    >

                </div>


                <button type="submit" class="add-btn">
                    + Add Product
                </button>

                <a href="/" class="cancel-btn">
                    Cancel
                </a>

            </form>

        </section>

    </main>

</div>

</body>

</html>
